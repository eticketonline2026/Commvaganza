<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#F97316"><title>Admin - COMMVAGANZA 10.0</title>
<link rel="icon" type="image/png" href="logo.png"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#FFFBF5;color:#1C1917;font-family:Arial,sans-serif;padding:20px}.wrap{max-width:1000px;margin:auto}.bar{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}.bar h1{margin:0;font-size:24px}.card{background:#fff;border:1px solid #E7E5E4;border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:0 8px 24px rgba(0,0,0,.05)}input,textarea,button{font:inherit}input,textarea{width:100%;padding:11px;border:1px solid #D6D3D1;border-radius:10px;margin:6px 0 12px}button{border:0;border-radius:10px;padding:11px 15px;background:#F97316;color:#fff;font-weight:700;cursor:pointer}.secondary{background:#57534E}.danger{background:#B91C1C}.hidden{display:none}.muted{color:#78716C;font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.review{border:1px solid #E7E5E4;border-radius:14px;padding:16px;margin:12px 0}.review-head{display:flex;justify-content:space-between;gap:10px}.badge{background:#FEF3C7;color:#92400E;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:700}.proof{max-width:320px;width:100%;border-radius:12px;border:1px solid #E7E5E4;margin:10px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.tabs{display:flex;gap:8px;margin-bottom:15px}.tabs button{background:#FFF7ED;color:#9A3412}.tabs button.active{background:#F97316;color:#fff}@media(max-width:700px){.grid{grid-template-columns:1fr}.bar{align-items:flex-start;flex-direction:column}}
</style></head>
<body><div class="wrap">
<div id="login" class="card"><h1>Admin COMMVAGANZA</h1><p class="muted">Login menggunakan akun Supabase Authentication yang sudah dimasukkan ke tabel admin_users.</p><input id="email" type="email" placeholder="Email admin"><input id="password" type="password" placeholder="Password"><button id="loginBtn">Masuk</button><p id="loginMsg" class="muted"></p></div>
<div id="panel" class="hidden"><div class="bar"><h1>Panel Admin</h1><button id="logout" class="secondary">Keluar</button></div><div class="tabs"><button id="paymentsTab" class="active">Verifikasi Pembayaran</button><button id="checkinTab">Check-in</button></div>
<section id="payments"><div class="card"><h2>Pembayaran Menunggu</h2><p class="muted">Periksa bukti pembayaran sebelum menyetujui order menjadi PAID.</p><button id="refresh">Refresh</button><div id="reviews">Memuat...</div></div></section>
<section id="checkin" class="hidden"><div class="card"><h2>Check-in Tiket</h2><input id="ticketCode" placeholder="CMV26-XXXXXXXXXX" autocomplete="off"><button id="checkBtn">Periksa & Check-in</button><div id="checkResult" class="muted" style="margin-top:12px"></div></div><div class="card"><h2>Statistik</h2><div id="stats" class="muted">Memuat...</div></div></section></div></div>
<script>
(function(){
const URL='https://uhjkhptfdxfamgnpuwpg.supabase.co',KEY='sb_publishable_4kUpyQSEX7IeHHTbAfaliQ_Em_ng8Ez',db=supabase.createClient(URL,KEY);const $=id=>document.getElementById(id);
function msg(t){$('loginMsg').textContent=t}
async function session(){const {data}=await db.auth.getSession();if(data.session)showPanel();}
function showPanel(){$('login').classList.add('hidden');$('panel').classList.remove('hidden');loadReviews();loadStats()}
$('loginBtn').onclick=async()=>{const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)msg(error.message);else{msg('');showPanel()}};
$('logout').onclick=()=>db.auth.signOut().then(()=>location.reload());
$('refresh').onclick=loadReviews;
$('paymentsTab').onclick=()=>{$('payments').classList.remove('hidden');$('checkin').classList.add('hidden');$('paymentsTab').classList.add('active');$('checkinTab').classList.remove('active')};
$('checkinTab').onclick=()=>{$('payments').classList.add('hidden');$('checkin').classList.remove('hidden');$('paymentsTab').classList.remove('active');$('checkinTab').classList.add('active');loadStats()};
async function loadReviews(){const box=$('reviews');box.textContent='Memuat...';const {data,error}=await db.rpc('get_pending_payment_reviews');if(error){box.textContent=error.message;return}if(!data?.length){box.innerHTML='<p class="muted">Tidak ada pembayaran menunggu.</p>';return}box.innerHTML='';for(const r of data){const div=document.createElement('div');div.className='review';div.innerHTML=`<div class="review-head"><strong>${esc(r.order_code)}</strong><span class="badge">PENDING</span></div><p><b>${esc(r.name)}</b><br>${esc(r.email)}<br>${esc(r.wa)}</p><p class="muted">${esc(r.ticket_type)} · ${r.qty} tiket · Rp${Number(r.total_price).toLocaleString('id-ID')}</p><p class="muted">Bukti: ${esc(r.original_filename||'file')}</p><div class="actions"><button data-id="${r.order_id}" class="openProof">Lihat Bukti</button><button data-id="${r.order_id}" class="approve">Setujui PAID</button><button data-id="${r.order_id}" class="danger reject">Tolak</button></div><div id="proof-${r.order_id}"></div></div>`;box.appendChild(div)}box.querySelectorAll('.openProof').forEach(b=>b.onclick=async()=>{const id=b.dataset.id;const r=data.find(x=>x.order_id===id);const {data:urlData,error}=await db.storage.from('payment-proofs').createSignedUrl(r.storage_path,300);const target=document.getElementById('proof-'+id);if(error){target.textContent=error.message}else{target.innerHTML=`<a href="${urlData.signedUrl}" target="_blank" rel="noopener"><img class="proof" src="${urlData.signedUrl}" alt="Bukti pembayaran"></a>`}});box.querySelectorAll('.approve').forEach(b=>b.onclick=async()=>{if(!confirm('Setujui pembayaran ini menjadi PAID?'))return;const {error}=await db.rpc('approve_order_payment',{p_order_id:b.dataset.id});if(error)alert(error.message);else{alert('Pembayaran disetujui. E-ticket aktif.');loadReviews()}});box.querySelectorAll('.reject').forEach(b=>b.onclick=async()=>{const reason=prompt('Alasan penolakan (opsional):')??'';const {error}=await db.rpc('reject_order_payment',{p_order_id:b.dataset.id,p_reason:reason});if(error)alert(error.message);else loadReviews()})}
async function loadStats(){const {data,error}=await db.rpc('get_checkin_stats');$('stats').textContent=error?error.message:`Total: ${data?.[0]?.total_tickets||0} · Sudah check-in: ${data?.[0]?.checked_in||0} · Sisa: ${data?.[0]?.remaining||0}`}
$('checkBtn').onclick=async()=>{const code=$('ticketCode').value.trim();if(!code)return;const {data,error}=await db.rpc('check_in_ticket',{p_ticket_code:code});$('checkResult').textContent=error?error.message:(data?.[0]?`${data[0].status} — ${data[0].name||'-'} — ${data[0].ticket_code}`:'Tidak ada hasil');loadStats()};
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}session();
})();
</script></body></html>
