<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#F97316">
<title>E-Ticket - COMMVAGANZA 10.0</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(1000px 500px at 50% -10%,rgba(251,191,36,.12),transparent 60%),#FFFBF5;color:#1C1917;font-family:'Plus Jakarta Sans',Arial,sans-serif;padding:20px;-webkit-font-smoothing:antialiased}.wrap{max-width:520px;margin:0 auto}.top{display:flex;align-items:center;gap:12px;margin:10px 0 18px}.top img{width:42px;height:42px;border-radius:12px;object-fit:cover}.top strong{font-size:18px}.card{background:#fff;border:1px solid #E7E5E4;border-radius:24px;overflow:hidden;box-shadow:0 18px 50px rgba(249,115,22,.1)}.head{padding:24px;background:linear-gradient(135deg,#F97316,#EA580C);color:#fff}.head small{display:block;font-size:11px;letter-spacing:1.4px;text-transform:uppercase;opacity:.85}.head h1{margin:5px 0 0;font-size:25px}.body{padding:24px}.status{display:inline-flex;padding:7px 11px;border-radius:999px;background:#DCFCE7;color:#166534;font-size:12px;font-weight:800;margin-bottom:18px}.name{font-size:24px;font-weight:800;margin-bottom:4px}.type{font-size:14px;color:#78716C;margin-bottom:20px}.details{display:grid;grid-template-columns:1fr 1fr;gap:12px}.detail{padding:13px;border:1px solid #E7E5E4;border-radius:13px;background:#FFFCF8}.detail span{display:block;font-size:10px;color:#A8A29E;text-transform:uppercase;letter-spacing:.08em;font-weight:700;margin-bottom:5px}.detail strong{font-size:13px;line-height:1.4;word-break:break-word}.qr{display:flex;justify-content:center;padding:20px 0 8px}.qr canvas{max-width:100%;height:auto!important}.code{text-align:center;font-size:18px;font-weight:800;letter-spacing:1px;word-break:break-all}.hint{text-align:center;font-size:11px;color:#78716C;line-height:1.5;margin:8px 0 20px}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{flex:1;min-width:150px;text-align:center;text-decoration:none;border:0;border-radius:12px;padding:13px 15px;font:800 13px inherit;cursor:pointer;background:#F97316;color:#fff}.btn.secondary{background:#FFF7ED;color:#C2410C;border:1px solid #FED7AA}.error{padding:22px;background:#FEF2F2;border:1px solid #FECACA;color:#991B1B;border-radius:14px;line-height:1.6}.ticket-picker{display:flex;gap:8px;overflow:auto;margin:0 0 18px;padding-bottom:3px}.ticket-picker button{border:1px solid #FED7AA;background:#FFF7ED;color:#9A3412;border-radius:999px;padding:8px 12px;font:700 11px inherit;cursor:pointer;white-space:nowrap}.ticket-picker button.active{background:#F97316;color:#fff}.loading{text-align:center;padding:35px;color:#78716C}@media(max-width:420px){body{padding:12px}.body{padding:18px}.details{grid-template-columns:1fr}.name{font-size:21px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><img src="logo.png" alt="Logo"><strong>COMMVAGANZA 10.0</strong></div>
  <div id="app" class="loading">Memuat e-ticket...</div>
</div>
<script>
(function(){
'use strict';
const SUPABASE_URL='https://uhjkhptfdxfamgnpuwpg.supabase.co';
const SUPABASE_KEY='sb_publishable_4kUpyQSEX7IeHHTbAfaliQ_Em_ng8Ez';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const app=document.getElementById('app');
const params=new URLSearchParams(location.search);
let codes=[]; try{codes=JSON.parse(localStorage.getItem('commvaganza_ticket_codes')||'[]')}catch(e){codes=[]}
const selected=params.get('code') || codes[0] || '';
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtDate(v){try{return new Intl.DateTimeFormat('id-ID',{day:'2-digit',month:'long',year:'numeric'}).format(new Date(v+'T00:00:00'));}catch(e){return v}}
async function load(){
  if(!selected){app.innerHTML='<div class="error"><strong>Kode tiket tidak ditemukan.</strong><br>Gunakan link e-ticket dari pesanan Anda atau masukkan kode tiket yang valid.</div>';return;}
  const {data,error}=await db.rpc('get_public_ticket',{p_ticket_code:selected});
  if(error||!data||!data.length){app.innerHTML='<div class="error"><strong>E-ticket belum tersedia atau tidak valid.</strong><br>Pastikan pembayaran sudah disetujui admin dan kode tiket benar.</div>';return;}
  const t=data[0];
  app.className='card';
  app.innerHTML=`<div class="head"><small>Electronic Ticket</small><h1>Picnic Music Festival COMMVAGANZA 10.0</h1></div><div class="body"><div class="status">✓ TIKET VALID</div><div class="name">${esc(t.name)}</div><div class="type">${esc(t.ticket_type)}</div><div class="details"><div class="detail"><span>Tanggal</span><strong>${esc(fmtDate(t.event_date))}</strong></div><div class="detail"><span>Waktu</span><strong>${esc(t.event_time)}</strong></div><div class="detail"><span>Lokasi</span><strong>${esc(t.location)}</strong></div><div class="detail"><span>Kode Tiket</span><strong>${esc(t.ticket_code)}</strong></div></div><div class="qr"><canvas id="ticketQr" width="220" height="220"></canvas></div><div class="code">${esc(t.ticket_code)}</div><div class="hint">Tunjukkan QR Code ini saat check-in. Satu tiket hanya dapat digunakan satu kali.</div><div class="actions"><a class="btn secondary" href="index.html">Beranda</a><button class="btn" id="printBtn" type="button">Cetak / Simpan PDF</button></div></div>`;
  await QRCode.toCanvas(document.getElementById('ticketQr'),location.origin+location.pathname+'?code='+encodeURIComponent(t.ticket_code),{width:220,margin:2,errorCorrectionLevel:'M'});
  document.getElementById('printBtn').onclick=()=>window.print();
}
load();
})();
</script>
</body>
</html>
